<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Detection Copilot</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%230a0e14' stroke='%232dd4bf' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%232dd4bf'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">&#9679;</span>
        <span class="brand-name">SOC Detection Copilot</span>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="topbar-right">
        <span class="ai-status" id="aiStatus">AI: checking…</span>
      </div>
    </header>

    <div class="pipeline-bar" id="pipelineBar"></div>

    <main class="content" id="content">
      <!-- Panels injected by app.js -->
    </main>

    <footer class="statusbar">
      <span id="sessionLabel">No dataset loaded</span>
      <span id="statusMessage"></span>
    </footer>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
